<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMO Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
      min-height: 100vh;
      color: #2c3e50;
    }
    
    .container { 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 24px;
      padding-top: 80px;
    }

    /* Logout Button - In Header */
    .logout-btn {
      display: none;
    }

    /* Header */
    .header {
      background: white;
      padding: 32px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border-left: 5px solid #c41e3a;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: #7f8c8d;
    }

    .header-stats {
      display: flex;
      gap: 40px;
      margin-top: 24px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #c41e3a;
    }

    .stat-label {
      font-size: 12px;
      color: #95a5a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Tabs */
    .tabs-wrapper {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      background: white;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 24px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #7f8c8d;
      border-radius: 8px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex: 1;
      min-width: 120px;
    }

    .tab-btn:hover {
      background: #f5f7fa;
    }

    .tab-btn.active {
      background: #c41e3a;
      color: white;
      box-shadow: 0 4px 12px rgba(196, 30, 58, 0.2);
    }

    /* Toolbar */
    .toolbar-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e0e7ff;
      border-radius: 6px;
      font-size: 13px;
      transition: all 0.2s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #c41e3a;
      box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
    }

    .filter-select {
      padding: 10px 14px;
      border: 1px solid #e0e7ff;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: white;
      font-weight: 500;
      min-width: 120px;
    }

    .filter-select:focus {
      outline: none;
      border-color: #c41e3a;
      box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
    }

    .btn {
      padding: 10px 18px;
      background: #c41e3a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn:hover {
      background: #a01830;
    }

    .btn-secondary {
      background: white;
      color: #c41e3a;
      border: 1px solid #c41e3a;
    }

    /* Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border-left: 4px solid #c41e3a;
      cursor: pointer;
      transition: all 0.3s;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .metric-label {
      font-size: 12px;
      font-weight: 600;
      color: #95a5a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .metric-value {
      font-size: 36px;
      font-weight: 700;
      color: #c41e3a;
      margin-bottom: 8px;
    }

    .metric-subtitle {
      font-size: 12px;
      color: #95a5a6;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: #ecf0f1;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #c41e3a;
    }

    /* Table */
    .table-container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f8f9fa;
      padding: 16px 20px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #e8eef5;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f2f5;
      font-size: 13px;
    }

    tbody tr:hover {
      background: #f8faff;
    }

    .task-name {
      font-weight: 600;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-name input {
      padding: 6px 10px;
      border: 1px solid #c41e3a;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }

    .task-name input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
    }

    .task-edit-icon {
      opacity: 0;
      cursor: pointer;
      color: #c41e3a;
      font-size: 12px;
      transition: opacity 0.2s;
    }

    tbody tr:hover .task-edit-icon {
      opacity: 1;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-on-track { background: #d4edda; color: #155724; }
    .status-at-risk { background: #fff3cd; color: #856404; }
    .status-overdue { background: #f8d7da; color: #721c24; }
    .status-complete { background: #d1e7dd; color: #0f5132; }

    /* Expanded Row */
    .expanded-row {
      background: #f8faff;
    }

    .expanded-row td {
      padding: 24px 20px;
      border-bottom: 1px solid #f0f2f5;
    }

    /* Checkpoints */
    .checkpoint-section h4 {
      font-size: 13px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 16px;
    }

    .checkpoint-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .checkpoint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: white;
      border-radius: 6px;
      border: 1px solid #e8eef5;
      transition: all 0.2s;
    }

    .checkpoint-item:hover {
      border-color: #c41e3a;
      background: #fff9f9;
    }

    .checkpoint-item input {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: #c41e3a;
    }

    .checkpoint-item label {
      cursor: pointer;
      font-size: 12px;
      margin: 0;
      color: #2c3e50;
      font-weight: 500;
    }

    .db-notice {
      background: #ffe8e8;
      border: 1px solid #ffc6c6;
      border-radius: 6px;
      padding: 12px;
      font-size: 11px;
      color: #c41e3a;
      margin-top: 12px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #95a5a6;
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e7ff;
      border-radius: 6px;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #c41e3a;
      box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    /* Login */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .login-screen.hidden {
      display: none;
    }

    .login-box {
      background: white;
      border-radius: 16px;
      padding: 48px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .login-box h2 {
      font-size: 32px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 12px;
    }

    .login-box i {
      font-size: 64px;
      color: #c41e3a;
      margin-bottom: 20px;
      display: block;
    }

    .login-input-group {
      margin-bottom: 24px;
      text-align: left;
    }

    .login-input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .login-input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e7ff;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .login-input-group input:focus {
      outline: none;
      border-color: #c41e3a;
      box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #c41e3a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #a01830;
    }

    .login-error {
      background: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
      border: 1px solid #f5c6cb;
    }

    .login-error.show {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <i class="fas fa-lock"></i>
      <h2>PMO Dashboard</h2>
      <div class="login-error" id="loginError"><i class="fas fa-times-circle"></i> Wrong password</div>
      <div class="login-input-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter code" 
               onkeypress="if(event.key==='Enter') authenticate()">
      </div>
      <button class="login-btn" onclick="authenticate()">Access</button>
    </div>
  </div>

  <button class="logout-btn" id="logoutBtn" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <h1><i class="fas fa-chart-gantt"></i> PMO Dashboard</h1>
          <p>Project Management & Risk Tracking</p>
        </div>
        <button class="btn" id="headerLogout" onclick="logout()" style="display:none; margin-top:8px;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
      <div class="header-stats">
        <div class="stat-item">
          <div class="stat-value" id="globalTotal">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="globalCompletion">0%</div>
          <div class="stat-label">Completion</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="globalRisk">0</div>
          <div class="stat-label">At Risk</div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-wrapper">
      <button class="tab-btn active" onclick="switchTab('bo')">BO</button>
      <button class="tab-btn" onclick="switchTab('pmo')">PMO</button>
      <button class="tab-btn" onclick="switchTab('dpqm')">DPQM</button>
      <button class="tab-btn" onclick="switchTab('pha')">PHA</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar-container">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" placeholder="🔍 Search..." id="searchInput" onkeyup="applyFilters()">
        </div>
        <select class="filter-select" id="monthFilter" onchange="applyFilters()">
          <option value="">All Months</option>
          <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
          <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
          <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
          <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
        </select>
        <select class="filter-select" id="yearFilter" onchange="applyFilters()">
          <option value="">All Years</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
        </select>
        <select class="filter-select" id="statusFilter" onchange="applyFilters()">
          <option value="">All Status</option>
          <option value="on-track">On Track</option>
          <option value="at-risk">At Risk</option>
          <option value="overdue">Overdue</option>
          <option value="complete">Complete</option>
        </select>
        <button class="btn" onclick="openAddTaskModal()"><i class="fas fa-plus"></i> Add Task</button>
      </div>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label"><i class="fas fa-list"></i> Total</div>
        <div class="metric-value" id="tabTotal">0</div>
        <div class="metric-subtitle" id="tabTotalSub">tasks</div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><i class="fas fa-check-circle"></i> Completion</div>
        <div class="metric-value" id="tabCompletion">0%</div>
        <div class="progress-container">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><i class="fas fa-exclamation-triangle"></i> At Risk</div>
        <div class="metric-value" id="tabAtRisk">0</div>
        <div class="metric-subtitle">next 3 days</div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><i class="fas fa-calendar-times"></i> Overdue</div>
        <div class="metric-value" id="tabOverdue">0</div>
        <div class="metric-subtitle">past deadline</div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:40px;"></th>
            <th>Task</th>
            <th>Priority</th>
            <th>Start Date</th>
            <th>Status</th>
            <th>Progress</th>
            <th style="width:80px;">View</th>
            <th style="width:50px;">Delete</th>
          </tr>
        </thead>
        <tbody id="taskBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <i class="fas fa-inbox"></i>
        <p>No tasks</p>
      </div>
    </div>
  </div>

  <!-- Add Task Modal -->
  <div class="modal" id="addTaskModal">
    <div class="modal-content">
      <div class="modal-header">Add Task</div>
      <div class="form-group">
        <label>Task Name</label>
        <input type="text" id="taskNameInput" placeholder="Enter task name">
      </div>
      <div class="form-group">
        <label>Start Date</label>
        <input type="date" id="taskDateInput">
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriorityInput">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddTaskModal()">Cancel</button>
        <button class="btn" onclick="saveNewTask()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const MILESTONES = [
      { label: 'Initiation', offset: 0 },
      { label: 'Planning', offset: 5 },
      { label: 'Execution', offset: 15 },
      { label: 'Monitoring', offset: 25 },
      { label: 'Closure', offset: 35 }
    ];

    const PRIORITIES = {
      high: { label: 'HIGH', color: '#c41e3a' },
      medium: { label: 'MEDIUM', color: '#f39c12' },
      low: { label: 'LOW', color: '#27ae60' }
    };

    let currentTab = 'bo';

    // INIT
    function init() {
      if (sessionStorage.getItem('pmo-auth') !== 'true') {
        document.getElementById('loginScreen').classList.remove('hidden');
        return;
      }
      unlockApp();
    }

    function authenticate() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === 'pmo2026') {
        sessionStorage.setItem('pmo-auth', 'true');
        document.getElementById('loginScreen').classList.add('hidden');
        unlockApp();
      } else {
        document.getElementById('loginError').classList.add('show');
        setTimeout(() => document.getElementById('loginError').classList.remove('show'), 2000);
      }
    }

    function unlockApp() {
      document.getElementById('headerLogout').style.display = 'block';
      initTasks();
      render();
    }

    function logout() {
      if (confirm('Logout?')) {
        sessionStorage.removeItem('pmo-auth');
        location.reload();
      }
    }

    // STORAGE
    function initTasks() {
      ['bo', 'pmo', 'dpqm', 'pha'].forEach(tab => {
        if (!localStorage.getItem(`tasks-${tab}`)) {
          localStorage.setItem(`tasks-${tab}`, JSON.stringify([
            { id: Date.now(), name: 'Kickoff Meeting', date: '2026-06-15', priority: 'high', checks: [0,0,0,0,0] }
          ]));
        }
      });
    }

    function getTasks(tab) {
      const data = localStorage.getItem(`tasks-${tab}`);
      return data ? JSON.parse(data) : [];
    }

    function saveTasks(tab, tasks) {
      localStorage.setItem(`tasks-${tab}`, JSON.stringify(tasks));
    }

    // CALCULATIONS
    function getStatus(date, checks) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      if (checks.every(c => c)) return 'complete';
      
      for (let i = 0; i < checks.length; i++) {
        if (!checks[i]) {
          const d = new Date(date);
          d.setDate(d.getDate() + MILESTONES[i].offset);
          if (d < today) return 'overdue';
          if ((d - today) < 3 * 24 * 60 * 60 * 1000) return 'at-risk';
        }
      }
      return 'on-track';
    }

    // RENDER
    function render() {
      const tasks = getTasks(currentTab);
      const tbody = document.getElementById('taskBody');
      const empty = document.getElementById('emptyState');

      if (tasks.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        tbody.innerHTML = tasks.map((task, idx) => {
          const status = getStatus(task.date, task.checks);
          const done = task.checks.filter(c => c).length;
          const pct = Math.round((done / 5) * 100);

          return `
            <tr>
              <td><i class="fas fa-chevron-down" onclick="toggleRow(this)" style="cursor:pointer; color:#c41e3a;"></i></td>
              <td>
                <div class="task-name" ondblclick="editName(${idx}, this)">
                  <span id="name-${idx}">${task.name}</span>
                  <i class="task-edit-icon fas fa-pencil-alt"></i>
                </div>
              </td>
              <td><span style="color:${PRIORITIES[task.priority].color}; font-weight:700;">${PRIORITIES[task.priority].label}</span></td>
              <td>${task.date}</td>
              <td><span class="status-badge status-${status}">${status}</span></td>
              <td>
                <div style="display:flex; gap:8px; align-items:center;">
                  <div class="progress-bar" style="width:60px;"><div class="progress-fill" style="width:${pct}%"></div></div>
                  <span style="font-size:11px; font-weight:600;">${pct}%</span>
                </div>
              </td>
              <td><button class="btn btn-secondary" style="padding:6px 10px; font-size:11px;" onclick="expandRow(this)">View</button></td>
              <td><button class="btn" style="padding:6px 10px; font-size:11px; background:#dc3545;" onclick="deleteTask(${idx})"><i class="fas fa-trash"></i></button></td>
            </tr>
            <tr class="expanded-row" style="display:none;">
              <td colspan="7">
                <div class="checkpoint-section">
                  <h4>✓ Milestones (Editable)</h4>
                  <div class="checkpoint-list">
                    ${MILESTONES.map((m, i) => `
                      <div class="checkpoint-item">
                        <input type="checkbox" ${task.checks[i] ? 'checked' : ''} 
                               onchange="checkMilestone(${idx}, ${i})">
                        <label>${m.label}</label>
                      </div>
                    `).join('')}
                  </div>
                  <div class="db-notice">
                    <i class="fas fa-database"></i> Saved to browser storage. Backend integration pending.
                  </div>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      applyFilters();
      updateStats();
    }

    function toggleRow(el) {
      const row = el.closest('tr').nextElementSibling;
      if (row?.classList.contains('expanded-row')) {
        const show = row.style.display === 'none';
        row.style.display = show ? '' : 'none';
        el.style.transform = show ? 'rotate(-180deg)' : 'rotate(0deg)';
      }
    }

    function expandRow(btn) {
      const row = btn.closest('tr').nextElementSibling;
      row.style.display = row.style.display === 'none' ? '' : 'none';
    }

    function editName(idx, el) {
      const tasks = getTasks(currentTab);
      const span = el.querySelector('span');
      const input = document.createElement('input');
      input.type = 'text';
      input.value = span.textContent;
      span.replaceWith(input);
      input.focus();
      input.select();

      function save() {
        if (input.value.trim()) {
          tasks[idx].name = input.value.trim();
          saveTasks(currentTab, tasks);
          render();
        } else {
          render();
        }
      }

      input.onblur = save;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') save();
        if (e.key === 'Escape') render();
      };
    }

    function checkMilestone(idx, milestoneIdx) {
      const tasks = getTasks(currentTab);
      tasks[idx].checks[milestoneIdx] = tasks[idx].checks[milestoneIdx] ? 0 : 1;
      saveTasks(currentTab, tasks);
      render();
    }

    function deleteTask(idx) {
      const pwd = prompt('Enter password to delete:');
      if (pwd === null) return;
      if (pwd !== 'pmo2026') {
        alert('Wrong password');
        return;
      }
      const tasks = getTasks(currentTab);
      tasks.splice(idx, 1);
      saveTasks(currentTab, tasks);
      render();
    }

    // MODAL
    function openAddTaskModal() {
      document.getElementById('addTaskModal').classList.add('show');
      document.getElementById('taskNameInput').focus();
    }

    function closeAddTaskModal() {
      document.getElementById('addTaskModal').classList.remove('show');
    }

    function saveNewTask() {
      const name = document.getElementById('taskNameInput').value;
      const date = document.getElementById('taskDateInput').value;
      const priority = document.getElementById('taskPriorityInput').value;

      if (!name || !date) {
        alert('Fill all fields');
        return;
      }

      const tasks = getTasks(currentTab);
      tasks.push({
        id: Date.now(),
        name: name.trim(),
        date: date,
        priority: priority,
        checks: [0, 0, 0, 0, 0]
      });

      saveTasks(currentTab, tasks);
      closeAddTaskModal();
      document.getElementById('taskNameInput').value = '';
      document.getElementById('taskDateInput').value = '';
      render();
    }

    // FILTERS
    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const month = document.getElementById('monthFilter').value;
      const year = document.getElementById('yearFilter').value;
      const status = document.getElementById('statusFilter').value;

      document.querySelectorAll('#taskBody > tr:not(.expanded-row)').forEach(row => {
        const name = row.querySelector('span').textContent.toLowerCase();
        const date = row.querySelector('td:nth-child(4)').textContent;
        const statusText = row.querySelector('.status-badge').textContent.toLowerCase().replace(/\s/g, '-');

        const d = new Date(date);
        const m = String(d.getMonth() + 1);
        const y = String(d.getFullYear());

        let show = true;
        if (search && !name.includes(search)) show = false;
        if (month && m !== month) show = false;
        if (year && y !== year) show = false;
        if (status && !statusText.includes(status)) show = false;

        row.style.display = show ? '' : 'none';
        const next = row.nextElementSibling;
        if (next?.classList.contains('expanded-row')) {
          next.style.display = 'none';
        }
      });
    }

    // STATS
    function updateStats() {
      const tasks = getTasks(currentTab);
      const total = tasks.length;
      const done = tasks.filter(t => t.checks.every(c => c)).length;
      const atRisk = tasks.filter(t => {
        const s = getStatus(t.date, t.checks);
        return s === 'at-risk' || s === 'overdue';
      }).length;
      const overdue = tasks.filter(t => getStatus(t.date, t.checks) === 'overdue').length;

      document.getElementById('tabTotal').textContent = total;
      document.getElementById('tabTotalSub').textContent = total + ' tasks';
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('tabCompletion').textContent = pct + '%';
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('tabAtRisk').textContent = atRisk;
      document.getElementById('tabOverdue').textContent = overdue;

      // Global
      let gTotal = 0, gDone = 0, gRisk = 0;
      ['bo', 'pmo', 'dpqm', 'pha'].forEach(tab => {
        const t = getTasks(tab);
        gTotal += t.length;
        gDone += t.filter(x => x.checks.every(c => c)).length;
        gRisk += t.filter(x => {
          const s = getStatus(x.date, x.checks);
          return s === 'at-risk' || s === 'overdue';
        }).length;
      });

      document.getElementById('globalTotal').textContent = gTotal;
      document.getElementById('globalCompletion').textContent = (gTotal === 0 ? 0 : Math.round((gDone / gTotal) * 100)) + '%';
      document.getElementById('globalRisk').textContent = gRisk;
    }

    // TAB SWITCH
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    // START
    init();
  </script>
</body>
</html>
